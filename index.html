<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NLC Master Tactical Timer</title>
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#ff5500',
                        'brand-orange-glow': 'rgba(255, 85, 0, 0.4)',
                        'tactical-black': '#050505',
                        'tactical-gray': '#111111',
                        'premium-dark': '#0a0a0a',
                        'accent-red': '#EF4444',
                    },
                    boxShadow: {
                        'neon-orange': '0 0 20px rgba(255, 85, 0, 0.4), 0 0 40px rgba(255, 85, 0, 0.1)',
                        'neon-white': '0 0 15px rgba(255, 255, 255, 0.2)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700;800&family=Oswald:wght@300;400;600;700&display=swap');
        
        body {
            background-color: #030303;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #030303 70%);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-header { font-family: 'Oswald', sans-serif; }
        
        /* Custom Animations */
        @keyframes pulse-orange {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 85, 0, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 85, 0, 0); }
        }
        .animate-pulse-orange { animation: pulse-orange 2s infinite; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.5s ease-out forwards; }

        /* Premium Glass & Button Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        .btn-premium {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }
        .btn-premium:active { transform: scale(0.97); }
        .btn-premium.selected {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
        }
        
        .text-glow-orange { text-shadow: 0 0 20px rgba(255,85,0,0.6); }
        .text-glow-white { text-shadow: 0 0 20px rgba(255,255,255,0.4); }
        
        .nav-tab {
            transition: all 0.2s ease;
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .nav-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }
        .nav-tab.active { color: #ff5500; font-weight: 700; }
        .nav-tab.active::after { background-color: #ff5500; box-shadow: 0 0 10px #ff5500; }

        ::-webkit-scrollbar { width: 4px; display: none;}
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root" class="min-h-[100dvh] w-full relative z-10 flex flex-col"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- AUDIO ENGINES ---
        const SoundFX = {
            ctx: null,
            init: () => {
                if (!SoundFX.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) SoundFX.ctx = new AudioContext();
                }
                if (SoundFX.ctx && SoundFX.ctx.state === 'suspended') SoundFX.ctx.resume();
                return SoundFX.ctx;
            },
            play: (type) => {
                const ctx = SoundFX.init();
                if (!ctx) return;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                switch (type) {
                    case 'WORK': 
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5);
                        break;
                    case 'REST': 
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                        gain.gain.setValueAtTime(0.6, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                    case 'PIP': 
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(800, now);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                        osc.start(now); osc.stop(now + 0.05);
                        break;
                    case 'SERIES': 
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(660, now + 0.1);
                        osc.frequency.setValueAtTime(880, now + 0.2);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                        osc.start(now); osc.stop(now + 0.6);
                        break;
                }
            }
        };

        const SpeechEngine = {
            prime: () => {
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance('');
                    u.volume = 0;
                    window.speechSynthesis.speak(u);
                }
            },
            speak: (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 1.05; 
                    utterance.pitch = 0.9; 
                    utterance.volume = 1;
                    window.speechSynthesis.speak(utterance);
                }
            }
        };

        const useWakeLock = () => {
            const [isLocked, setIsLocked] = useState(false);
            const wakeLockRef = useRef(null);

            const request = useCallback(async () => {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                        setIsLocked(true);
                        wakeLockRef.current.addEventListener('release', () => setIsLocked(false));
                    }
                } catch (err) {
                    console.error('Wake Lock error:', err);
                    setIsLocked(false);
                }
            }, []);

            const release = useCallback(async () => {
                if (wakeLockRef.current) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                    setIsLocked(false);
                }
            }, []);

            useEffect(() => {
                const handleVisibility = () => {
                    if (document.visibilityState === 'visible') request();
                };
                document.addEventListener('visibilitychange', handleVisibility);
                return () => {
                    release();
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [request, release]);

            return { isLocked, request, release };
        };

        const Footer = () => (
            <div className="w-full text-center pb-6 pt-4 mt-auto">
                <span className="text-[10px] font-mono tracking-[0.4em] text-gray-500 uppercase opacity-60">
                    Adapt // Recover // Master
                </span>
            </div>
        );

        const SystemBadge = ({ text, active }) => (
            <div className="absolute top-6 right-6 flex items-center gap-2 z-50 glass-panel px-3 py-1.5 rounded-full border border-white/5 shadow-glass">
                <div className={`w-1.5 h-1.5 rounded-full ${active ? 'bg-brand-orange shadow-neon-orange animate-pulse' : 'bg-gray-600'}`}></div>
                <span className={`text-[10px] font-mono tracking-widest uppercase ${active ? 'text-white' : 'text-gray-500'}`}>{text}</span>
            </div>
        );

        // --- GATEWAY ---
        const Gateway = ({ onComplete }) => {
            const [soreness, setSoreness] = useState(null);
            const [tiredness, setTiredness] = useState(null);
            const [energy, setEnergy] = useState(null);

            const check = () => {
                let redFlags = 0;
                if (soreness === 3) redFlags++;
                if (tiredness === 3) redFlags++;
                if (energy === 1) redFlags++;
                onComplete(redFlags >= 2);
            };

            const getBtnColor = (isSelected, value, type) => {
                if (!isSelected) return 'btn-premium';
                const isBad = type === 'energy' ? value === 1 : value === 3;
                const isMed = value === 2;
                
                if (isBad) return 'bg-gradient-to-br from-orange-900 to-[#2a0e00] border-brand-orange text-brand-orange shadow-neon-orange font-semibold rounded-xl';
                if (isMed) return 'bg-gray-800 border-gray-500 text-gray-200 font-semibold rounded-xl';
                return 'bg-white border-white text-black shadow-neon-white font-semibold rounded-xl'; 
            };

            const Selector = ({ label, val, setVal, type }) => (
                <div className="mb-5">
                    <div className="flex justify-between items-center mb-2.5 px-1">
                        <span className="text-xs uppercase tracking-widest text-gray-400 font-medium">{label}</span>
                    </div>
                    <div className="flex gap-3 h-14">
                        {[1, 2, 3].map(v => (
                            <button 
                                key={v}
                                onClick={() => setVal(v)}
                                className={`flex-1 transition-all duration-300 font-mono text-sm tracking-wider ${getBtnColor(val === v, v, type)}`}
                            >
                                {type === 'energy' 
                                    ? (v === 1 ? 'LOW' : v === 2 ? 'MED' : 'HIGH')
                                    : (v === 1 ? 'LOW' : v === 2 ? 'MED' : 'HIGH')
                                }
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full animate-fade-in z-20 relative">
                    <div className="flex-1 flex flex-col justify-center">
                        <div className="mb-8 text-center">
                            <img src="nlcpWHITE.png" alt="NLC Performance" onError={(e) => { e.target.onerror = null; e.target.src='nlcpWHITE.jpg'; }} className="w-28 h-28 mx-auto rounded-full shadow-[0_0_30px_rgba(255,85,0,0.15)] mb-6 ring-1 ring-white/10 object-cover" />
                            <h1 className="text-4xl sm:text-5xl font-header font-bold tracking-tight leading-none text-white drop-shadow-lg mb-1">
                                MASTER <span className="text-brand-orange text-glow-orange">TIMER</span>
                            </h1>
                            <h2 className="text-[10px] font-mono tracking-[0.3em] text-gray-400 uppercase mt-2">Tactical Readiness System</h2>
                        </div>
                        
                        <div className="glass-panel p-5 sm:p-6 mb-6">
                            <Selector label="Soreness" val={soreness} setVal={setSoreness} type="negative" />
                            <Selector label="Tiredness" val={tiredness} setVal={setTiredness} type="negative" />
                            <Selector label="Energy Levels" val={energy} setVal={setEnergy} type="energy" />
                        </div>
                    </div>
                    
                    <button 
                        disabled={!soreness || !tiredness || !energy}
                        onClick={check}
                        className="w-full py-5 bg-white text-black font-semibold text-sm uppercase tracking-widest rounded-2xl disabled:opacity-20 disabled:scale-100 hover:scale-[1.02] hover:bg-brand-orange hover:text-white hover:shadow-neon-orange transition-all duration-300 shadow-lg"
                    >
                        Initialize System
                    </button>
                    <Footer />
                </div>
            );
        };

        // --- SETUP ---
        const Setup = ({ forcedLow, onLaunch }) => {
            const [activeTab, setActiveTab] = useState('ISO');

            // ISO State
            const [isoMins, setIsoMins] = useState(2);

            // Q&D State
            const [qdSeries, setQdSeries] = useState(2);
            
            // AXE State
            const [axeMins, setAxeMins] = useState(15);

            // DFW State
            const [dfwMins, setDfwMins] = useState(20);
            const [dfwRolled, setDfwRolled] = useState(false);
            const [dfwEquip, setDfwEquip] = useState('');
            const [dfwIntensity, setDfwIntensity] = useState('');

            const rollDfw = () => {
                SoundFX.init(); 
                const isDouble = Math.random() > 0.5;
                const rollInt = Math.floor(Math.random() * 6) + 1;
                
                setDfwEquip(isDouble ? 'Double KB' : 'Single KB');
                if (rollInt <= 2) setDfwIntensity('RPE 5 (Light)');
                else if (rollInt <= 4) setDfwIntensity('RPE 7 (Medium)');
                else setDfwIntensity('RPE 8 (Heavy)');

                setDfwRolled(true);
                SoundFX.play('SERIES');
            };

            const executeMission = () => {
                SpeechEngine.prime();
                SoundFX.init();
                
                let finalConfig = { mode: activeTab };
                if (activeTab === 'ISO') finalConfig.duration = isoMins * 60;
                if (activeTab === 'SNATCH') finalConfig.seriesCount = forcedLow ? 2 : qdSeries;
                if (activeTab === 'AXE') finalConfig.duration = axeMins * 60;
                if (activeTab === 'DFW') {
                    finalConfig.duration = dfwMins * 60;
                    finalConfig.equipment = dfwEquip;
                    finalConfig.intensity = dfwIntensity;
                }

                onLaunch(finalConfig);
            };

            return (
                <div className="h-full flex flex-col max-w-lg mx-auto w-full animate-fade-in z-20 relative">
                    
                    {/* Setup Navigation Tabs */}
                    <div className="px-6 pt-6 mb-4">
                        <div className="flex items-center gap-4 mb-6">
                            <img src="nlcpWHITE.png" alt="NLC Logo" onError={(e) => { e.target.onerror = null; e.target.src='nlcpWHITE.jpg'; }} className="w-10 h-10 rounded-full ring-1 ring-white/10" />
                            <div>
                                <h2 className="text-xl font-header font-bold text-white tracking-wide">MISSION CONFIG</h2>
                                <p className="text-[10px] font-mono text-brand-orange uppercase tracking-widest">Select Protocol</p>
                            </div>
                        </div>

                        <div className="flex gap-4 border-b border-white/10 overflow-x-auto pb-1 scrollbar-hide">
                            {['ISO', 'SNATCH', 'AXE', 'DFW'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`nav-tab text-xs md:text-sm font-header uppercase tracking-widest whitespace-nowrap pb-2 ${activeTab === tab ? 'active' : 'text-gray-500 hover:text-gray-300'}`}>
                                    {tab === 'SNATCH' ? 'Q&D' : tab === 'ISO' ? 'EXTREME ISO' : tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 px-6 overflow-y-auto pb-4">
                        
                        {/* ISO CONFIG */}
                        {activeTab === 'ISO' && (
                            <div className="animate-fade-in space-y-6">
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Target Hold Time</label>
                                    <div className="flex gap-2">
                                        {[1, 2, 3, 4, 5].map(m => (
                                            <button key={m} onClick={() => setIsoMins(m)} className={`btn-premium flex-1 py-4 text-sm ${isoMins === m ? 'selected' : ''}`}>{m}M</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-panel p-5 bg-white/5 border-l-4 border-l-brand-orange">
                                    <strong className="text-white block mb-1 text-sm font-header tracking-wider uppercase">The Extreme Iso Hold</strong>
                                    <p className="text-xs text-gray-400 mb-2 italic">Primer to build tendon stiffness and positional endurance.</p>
                                    <span className="text-brand-orange text-[10px] uppercase font-bold tracking-wider">Contraction:</span> <span className="text-xs text-gray-300">Actively pull the ground. <strong>Do not passively hang out.</strong></span>
                                </div>
                            </div>
                        )}

                        {/* Q&D CONFIG */}
                        {activeTab === 'SNATCH' && (
                            <div className="animate-fade-in space-y-6">
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Target Series</label>
                                    <div className="flex gap-2">
                                        {[2, 3, 4].map(s => (
                                            <button key={s} onClick={() => setQdSeries(s)} className={`btn-premium flex-1 py-4 text-sm ${qdSeries === s ? 'selected' : ''}`}>{s} Series</button>
                                        ))}
                                    </div>
                                    <p className="text-[10px] text-gray-500 mt-2 font-mono uppercase tracking-widest text-center">10s Max Work / 50s Active Nasal Recovery.<br/>5 Bursts = 1 Series.</p>
                                </div>
                                {forcedLow && <div className="text-brand-orange text-[10px] font-mono border border-brand-orange/50 rounded-lg px-3 py-2 bg-orange-900/20 shadow-neon-orange backdrop-blur-sm text-center">⚠ READINESS COMPROMISED: FORCED TO 2 SERIES</div>}
                            </div>
                        )}

                        {/* AXE CONFIG */}
                        {activeTab === 'AXE' && (
                            <div className="animate-fade-in space-y-6">
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Target EMOM Duration</label>
                                    <div className="flex gap-2">
                                        {[10, 15, 20, 30].map(m => (
                                            <button key={m} onClick={() => setAxeMins(m)} className={`btn-premium flex-1 py-4 text-sm ${axeMins === m ? 'selected' : ''}`}>{m}M</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-panel p-5 bg-white/5 border border-white/5">
                                    <strong className="text-brand-orange block mb-3 uppercase text-xs tracking-widest font-header">The 3 Stop Signs</strong>
                                    <ul className="text-xs text-gray-300 space-y-3 font-mono leading-relaxed">
                                        <li><span className="text-accent-red font-bold">1.</span> Velocity visibly drops.</li>
                                        <li><span className="text-accent-red font-bold">2.</span> Technique or posture breaks down.</li>
                                        <li><span className="text-accent-red font-bold">3.</span> Cannot recover with strict Nasal Breathing.</li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* DFW CONFIG */}
                        {activeTab === 'DFW' && (
                            <div className="animate-fade-in space-y-6">
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Target Time Domain</label>
                                    <div className="flex gap-2">
                                        {[20, 30].map(m => (
                                            <button key={m} onClick={() => setDfwMins(m)} className={`btn-premium flex-1 py-4 text-sm ${dfwMins === m ? 'selected' : ''}`}>{m} Min</button>
                                        ))}
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Stochastic Gateway</label>
                                    {!dfwRolled ? (
                                        <button onClick={rollDfw} className="w-full py-5 bg-white text-black font-semibold text-sm uppercase tracking-widest rounded-2xl hover:scale-[1.02] hover:bg-brand-orange hover:text-white transition-all duration-300 shadow-lg hover:shadow-neon-orange">
                                            Roll The Dice
                                        </button>
                                    ) : (
                                        <div className="animate-fade-in glass-panel p-6 shadow-2xl relative overflow-hidden border-t-2 border-t-brand-orange">
                                            <div className="text-gray-400 text-[10px] font-mono uppercase tracking-widest mb-2">Target Acquired</div>
                                            <div className="text-3xl font-header font-bold text-white leading-tight text-glow-white uppercase italic">{dfwEquip}</div>
                                            <div className="text-sm font-bold text-brand-orange uppercase mt-1 tracking-widest">{dfwIntensity}</div>
                                            <button onClick={() => setDfwRolled(false)} className="mt-4 text-[10px] uppercase tracking-widest text-gray-500 hover:text-white underline">Re-Roll</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>

                    <div className="px-6 pb-6 mt-auto">
                        <button 
                            disabled={activeTab === 'DFW' && !dfwRolled}
                            onClick={executeMission}
                            className="w-full py-5 bg-gradient-to-r from-brand-orange to-[#ff7700] text-white font-semibold text-sm uppercase tracking-widest rounded-xl hover:scale-[1.02] hover:shadow-neon-orange disabled:opacity-30 disabled:scale-100 transition-all duration-300"
                        >
                            Execute Order
                        </button>
                    </div>
                </div>
            );
        };

        // --- ACTIVE SESSION ---
        const ActiveSession = ({ config, onFinish, onCancel }) => {
            const [timeElapsed, setTimeElapsed] = useState(0); 
            const [isActive, setIsActive] = useState(false);
            const [showAbortModal, setShowAbortModal] = useState(false);
            
            // Mode Specific State
            const [qdSeries, setQdSeries] = useState(1);
            const [qdBurst, setQdBurst] = useState(1);
            const [dfwCounts, setDfwCounts] = useState({ 1: 0, 2: 0, 3: 0 });

            const intervalRef = useRef(null);
            const { isLocked, request: requestLock } = useWakeLock();

            // Computed Variables
            const isoTotal = config.mode === 'ISO' ? config.duration : 0;
            const axeTotal = config.mode === 'AXE' ? config.duration : 0;
            const dfwTotal = config.mode === 'DFW' ? config.duration : 0;
            
            useEffect(() => { 
                setIsActive(true); 
                requestLock();
                SpeechEngine.speak("Standby. Mission begins.");
            }, [requestLock]);

            useEffect(() => {
                if (isActive && !showAbortModal) {
                    intervalRef.current = setInterval(() => {
                        setTimeElapsed(t => t + 1);
                    }, 1000);
                } else {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [isActive, showAbortModal]);

            // Audio & Phase Management via Effect
            useEffect(() => {
                if (!isActive) return;

                if (config.mode === 'ISO') {
                    const remaining = isoTotal - timeElapsed;
                    if (remaining === Math.floor(isoTotal / 2)) SpeechEngine.speak("Halfway there. Maintain tension.");
                    if (remaining === 30) SpeechEngine.speak("Thirty seconds. Do not break.");
                    if (remaining === 10) SpeechEngine.speak("Ten seconds.");
                    if (remaining <= 5 && remaining > 0) SpeechEngine.speak(remaining.toString());
                    if (remaining <= 0) handleCompletion();
                }
                
                else if (config.mode === 'SNATCH') {
                    // Q&D: 10s work, 50s rest. 5 bursts per series. Let's say 1 min rest between series.
                    // Total per series block = (60s * 5) = 300s + 60s extra rest = 360s.
                    // Actually, keep it simple: Continuous 60s loops. 5 bursts = 1 series.
                    const seriesTime = timeElapsed % 300; 
                    const burstTime = seriesTime % 60;
                    
                    if (timeElapsed > 0 && seriesTime === 0) {
                        if (qdSeries < config.seriesCount) {
                            setQdSeries(s => s + 1);
                            setQdBurst(1);
                        } else {
                            handleCompletion();
                            return;
                        }
                    } else if (timeElapsed > 0 && burstTime === 0) {
                        setQdBurst(b => b + 1);
                    }

                    if (burstTime === 55) SpeechEngine.speak("Five seconds.");
                    if (burstTime === 0) { SpeechEngine.speak("Work."); SoundFX.play('WORK'); }
                    if (burstTime === 10) { SpeechEngine.speak("Recover."); SoundFX.play('REST'); }
                    if (burstTime > 56 && burstTime < 60) SoundFX.play('PIP');
                }

                else if (config.mode === 'AXE') {
                    const emomTime = timeElapsed % 60;
                    
                    if (timeElapsed >= axeTotal) {
                        handleCompletion();
                        return;
                    }

                    if (emomTime === 55) SpeechEngine.speak("Five seconds.");
                    if (emomTime === 0) { SpeechEngine.speak("Go."); SoundFX.play('WORK'); }
                    if (emomTime > 56 && emomTime < 60) SoundFX.play('PIP');
                }

                else if (config.mode === 'DFW') {
                    const remaining = dfwTotal - timeElapsed;
                    if (remaining === 300) SpeechEngine.speak("Five minutes remaining. Push the pace.");
                    if (remaining <= 0) handleCompletion();
                }

            }, [timeElapsed, isActive, config, isoTotal, axeTotal, dfwTotal, qdSeries]);

            const handleCompletion = () => {
                setIsActive(false);
                clearInterval(intervalRef.current);
                SpeechEngine.speak("Mission Complete. Well done.");
                onFinish(timeElapsed, dfwCounts);
            };

            const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

            // --- RENDER LOGIC BY MODE ---
            const renderISO = () => {
                const remaining = Math.max(0, isoTotal - timeElapsed);
                return (
                    <div className="flex-1 flex flex-col items-center justify-center">
                        <div className="text-brand-orange text-xs font-bold tracking-widest uppercase mb-4">EXTREME ISO HOLD</div>
                        <div className="text-white font-mono font-black text-8xl md:text-9xl tracking-tighter drop-shadow-[0_0_20px_rgba(255,255,255,0.1)]">{formatTime(remaining)}</div>
                        <div className="w-full bg-black/50 border border-white/10 h-2 mt-12 rounded-full overflow-hidden">
                            <div className="h-full bg-brand-orange transition-all duration-1000 linear" style={{width: `${(timeElapsed / isoTotal) * 100}%`}}></div>
                        </div>
                    </div>
                );
            };

            const renderSnatch = () => {
                const burstTime = timeElapsed % 60;
                let phase = 'READY';
                let isRest = false;
                if (burstTime >= 0 && burstTime < 10) phase = 'WORK';
                else if (burstTime >= 10 && burstTime < 55) { phase = 'NASAL REST'; isRest = true; }
                else if (burstTime >= 55 && burstTime < 60) { phase = 'PREP'; isRest = true; }

                return (
                    <div className="flex-1 flex flex-col w-full">
                        <div className="flex justify-between w-full mb-8">
                            <div className="glass-panel px-4 py-2 border-none bg-white/5 text-center">
                                <div className="text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1">Series</div>
                                <div className="text-2xl font-header font-bold text-white">{qdSeries} <span className="text-gray-500 text-lg">/ {config.seriesCount}</span></div>
                            </div>
                            <div className="glass-panel px-4 py-2 border-none bg-white/5 text-center">
                                <div className="text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1">Burst</div>
                                <div className="text-2xl font-header font-bold text-white">{qdBurst} <span className="text-gray-500 text-lg">/ 5</span></div>
                            </div>
                        </div>
                        <div className="flex-1 flex flex-col items-center justify-center relative">
                            <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl -z-10 pointer-events-none ${isRest ? 'bg-transparent' : 'bg-brand-orange/20 animate-pulse-orange'}`}></div>
                            <div className={`text-6xl md:text-7xl font-header font-bold italic uppercase text-center mb-6 transition-colors duration-500 ${isRest ? 'text-gray-500' : 'text-brand-orange text-glow-orange'}`}>
                                {timeElapsed === 0 && !isActive ? 'READY' : phase}
                            </div>
                            <div className="text-8xl md:text-9xl font-mono font-bold text-white tracking-tighter drop-shadow-xl">{formatTime(60 - burstTime)}</div>
                        </div>
                    </div>
                );
            };

            const renderAxe = () => {
                const emomTime = timeElapsed % 60;
                const round = Math.floor(timeElapsed / 60) + 1;
                let phase = 'READY';
                let isRest = false;
                if (emomTime >= 0 && emomTime < 8) phase = 'WORK';
                else if (emomTime >= 8 && emomTime < 55) { phase = 'NASAL REST'; isRest = true; }
                else if (emomTime >= 55 && emomTime < 60) { phase = 'PREP'; isRest = true; }

                return (
                    <div className="flex-1 flex flex-col w-full">
                        <div className="flex justify-between items-center w-full mb-8 glass-panel px-6 py-3 border-none bg-white/5">
                            <div className="text-[10px] font-mono text-gray-400 uppercase tracking-widest">EMOM Round</div>
                            <div className="text-2xl font-header font-bold text-white">{Math.min(round, config.duration / 60)} <span className="text-gray-500 text-lg">/ {config.duration / 60}</span></div>
                        </div>
                        <div className="flex-1 flex flex-col items-center justify-center relative">
                            <div className={`text-6xl md:text-7xl font-header font-bold italic uppercase text-center mb-6 transition-colors duration-500 ${isRest ? 'text-gray-500' : 'text-brand-orange text-glow-orange'}`}>
                                {timeElapsed === 0 && !isActive ? 'READY' : phase}
                            </div>
                            <div className="text-8xl md:text-9xl font-mono font-bold text-white tracking-tighter drop-shadow-xl">{formatTime(60 - emomTime)}</div>
                        </div>
                        <div className="w-full glass-panel p-4 mb-4 text-center border-brand-orange/30">
                            <span className="text-brand-orange font-bold uppercase text-[10px] tracking-widest">🛑 Stop Rules Active</span>
                            <p className="text-gray-400 text-xs mt-1">Abort if velocity drops, form breaks, or breathing fails.</p>
                        </div>
                    </div>
                );
            };

            const renderDfw = () => {
                const remaining = Math.max(0, dfwTotal - timeElapsed);
                const updateCount = (type, val) => {
                    setDfwCounts(prev => ({...prev, [type]: Math.max(0, prev[type] + val)}));
                };

                return (
                    <div className="flex-1 flex flex-col w-full">
                        <div className="flex justify-between items-center w-full mb-6">
                            <div className="text-xs font-mono text-gray-500 uppercase tracking-widest">{config.equipment}</div>
                            <div className="text-xs font-mono text-brand-orange uppercase tracking-widest">{config.intensity}</div>
                        </div>
                        <div className="flex-1 flex flex-col items-center justify-center">
                            <div className="text-8xl md:text-9xl font-mono font-black text-white tracking-tighter drop-shadow-[0_0_20px_rgba(255,255,255,0.1)] mb-8">{formatTime(remaining)}</div>
                        </div>
                        
                        <div className="w-full glass-panel p-5 border-t border-white/10 mb-4 bg-white/5">
                            <div className="text-[10px] tracking-widest text-gray-400 font-bold uppercase mb-4 text-center">Ladder Tracker</div>
                            <div className="grid grid-cols-3 gap-3 mb-4">
                                {[1, 2, 3].map(ladder => (
                                    <div key={ladder} className="flex flex-col items-center">
                                        <span className="text-[10px] text-brand-orange font-bold uppercase mb-2">{ladder} Rep</span>
                                        <button onClick={() => updateCount(ladder, 1)} className="w-full aspect-square rounded-xl bg-black border border-white/10 hover:border-brand-orange text-3xl font-header font-bold text-white transition-colors">{dfwCounts[ladder]}</button>
                                        <button onClick={() => updateCount(ladder, -1)} className="mt-2 text-gray-600 hover:text-gray-400 p-2 text-xl">-</button>
                                    </div>
                                ))}
                            </div>
                            <div className="text-center pt-3 border-t border-white/10">
                                <div className="text-[10px] uppercase tracking-widest text-gray-500 mb-1">Total Reps Logged</div>
                                <div className="text-2xl font-header font-bold text-white">{(dfwCounts[1] * 2) + (dfwCounts[2] * 4) + (dfwCounts[3] * 6)}</div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto relative w-full z-20">
                    <SystemBadge text="Screen Lock Active" active={isLocked} />
                    
                    <div className="flex-1 flex flex-col mt-8">
                        {config.mode === 'ISO' && renderISO()}
                        {config.mode === 'SNATCH' && renderSnatch()}
                        {config.mode === 'AXE' && renderAxe()}
                        {config.mode === 'DFW' && renderDfw()}
                    </div>

                    {/* Controls */}
                    <div className="mt-auto pt-4 w-full">
                        <div className="flex gap-4 mb-6">
                            <button onClick={() => setIsActive(!isActive)} className={`flex-1 py-4 font-bold uppercase tracking-widest rounded-xl transition-all ${isActive ? 'bg-gray-800 text-brand-orange border border-gray-700' : 'bg-brand-orange text-white shadow-neon-orange hover:bg-[#ff7700]'}`}>
                                {isActive ? 'Pause' : 'Resume'}
                            </button>
                        </div>
                        <div className="text-center">
                            <button onClick={() => setShowAbortModal(true)} className="text-[10px] font-semibold text-gray-500 uppercase tracking-widest hover:text-accent-red px-6 py-3 transition-colors rounded-full hover:bg-white/5">
                                Abort Mission
                            </button>
                        </div>
                    </div>

                    {/* ABORT MODAL */}
                    {showAbortModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6 backdrop-blur-xl">
                            <div className="w-full max-w-sm glass-panel p-8 text-center animate-fade-in border border-brand-orange/50 shadow-2xl">
                                <h2 className="text-2xl font-header font-bold text-white uppercase mb-2">Abort Mission?</h2>
                                <p className="text-gray-400 mb-8 text-sm leading-relaxed">Active session data will be permanently lost.</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowAbortModal(false)} className="flex-1 py-4 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition-colors">Resume</button>
                                    <button onClick={() => { SpeechEngine.speak("Mission Aborted."); onCancel(); }} className="flex-1 py-4 bg-accent-red hover:bg-red-500 text-white font-bold rounded-xl transition-colors">ABORT</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- SUMMARY ---
        const Summary = ({ totalTime, config, dfwCounts, onReset }) => {
            const formatTime = (s) => `${Math.floor(s / 60)}m ${s % 60}s`;

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full justify-center text-center animate-fade-in z-20 relative">
                    <img src="nlcpWHITE.png" alt="NLC Logo" onError={(e) => { e.target.onerror = null; e.target.src='nlcpWHITE.jpg'; }} className="w-20 h-20 mx-auto rounded-full ring-1 ring-white/10 mb-6 opacity-80 object-cover" />
                    <h1 className="text-4xl md:text-5xl font-header font-bold text-white mb-4 drop-shadow-lg text-glow-white">MISSION COMPLETE</h1>
                    <div className="w-12 h-1 bg-brand-orange mx-auto mb-10 shadow-neon-orange rounded-full"></div>
                    
                    <div className="grid grid-cols-2 gap-4 mb-10">
                        <div className="glass-panel p-6 flex flex-col justify-center shadow-lg bg-white/5">
                            <div className="text-[10px] font-semibold text-brand-orange uppercase tracking-widest mb-2">Protocol</div>
                            <div className="text-xl font-header font-bold text-white">{config.mode === 'SNATCH' ? 'Q&D' : config.mode}</div>
                        </div>
                        <div className="glass-panel p-6 flex flex-col justify-center shadow-lg bg-white/5">
                            <div className="text-[10px] font-semibold text-brand-orange uppercase tracking-widest mb-2">Duration</div>
                            <div className="text-xl font-mono text-white">{formatTime(totalTime)}</div>
                        </div>
                    </div>
                    
                    {config.mode === 'DFW' && dfwCounts && (
                        <div className="glass-panel p-6 mb-10 bg-white/5">
                            <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2">Total DFW Reps Logged</div>
                            <div className="text-3xl font-header font-bold text-white">{(dfwCounts[1] * 2) + (dfwCounts[2] * 4) + (dfwCounts[3] * 6)}</div>
                        </div>
                    )}
                    
                    <div className="mt-auto flex flex-col items-center relative z-10">
                        <button onClick={onReset} className="text-gray-400 border border-white/10 px-8 py-4 text-xs font-semibold uppercase tracking-widest rounded-2xl hover:text-white hover:bg-white/5 transition-all mb-4 glass-panel">
                            Restart System
                        </button>
                        <Footer />
                    </div>
                </div>
            );
        };

        // --- APP ROOT ---
        const App = () => {
            const [view, setView] = useState('GATEWAY'); 
            const [forcedLow, setForcedLow] = useState(false);
            const [config, setConfig] = useState({});
            const [sessionData, setSessionData] = useState({});

            const handleGatewayComplete = (isLow) => {
                setForcedLow(isLow);
                setView('SETUP');
            };

            const handleLaunch = (launchConfig) => {
                setConfig(launchConfig);
                setView('WORKOUT');
            };

            const handleFinish = (finalTime, dfwCounts = null) => {
                setSessionData({ time: finalTime, config: config, dfwCounts });
                setView('SUMMARY');
            };

            const handleCancel = () => {
                setForcedLow(false);
                setConfig({});
                setView('GATEWAY');
            };

            return (
                <div className="w-full h-full">
                    {view === 'GATEWAY' && <Gateway onComplete={handleGatewayComplete} />}
                    {view === 'SETUP' && <Setup forcedLow={forcedLow} onLaunch={handleLaunch} />}
                    {view === 'WORKOUT' && <ActiveSession config={config} onFinish={handleFinish} onCancel={handleCancel} />}
                    {view === 'SUMMARY' && <Summary totalTime={sessionData.time} config={sessionData.config} dfwCounts={sessionData.dfwCounts} onReset={handleCancel} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
