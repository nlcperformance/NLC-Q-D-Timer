<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Q&D Timer - NLC Performance</title>
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#ff5500',
                        'brand-orange-glow': 'rgba(255, 85, 0, 0.4)',
                        'tactical-black': '#050505',
                        'tactical-gray': '#111111',
                        'premium-dark': '#0a0a0a',
                    },
                    boxShadow: {
                        'neon-orange': '0 0 20px rgba(255, 85, 0, 0.4), 0 0 40px rgba(255, 85, 0, 0.1)',
                        'neon-white': '0 0 15px rgba(255, 255, 255, 0.2)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700;800&family=Oswald:wght@300;400;600;700&display=swap');
        
        body {
            background-color: #030303;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #030303 70%);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-header { font-family: 'Oswald', sans-serif; }
        
        /* Custom Animations */
        @keyframes pulse-orange {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 85, 0, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 85, 0, 0); }
        }
        .animate-pulse-orange { animation: pulse-orange 2s infinite; }

        /* Premium Glass & Button Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        .btn-premium {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }
        .btn-premium:active { transform: scale(0.97); }
        .btn-premium.selected {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
        }
        
        .text-glow-orange { text-shadow: 0 0 20px rgba(255,85,0,0.6); }
        .text-glow-white { text-shadow: 0 0 20px rgba(255,255,255,0.4); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root" class="min-h-[100dvh] w-full relative z-10 flex flex-col"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- AUDIO ENGINES ---
        // 1. Synth Beeps for precision timing
        const SoundFX = {
            ctx: null,
            init: () => {
                if (!SoundFX.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) SoundFX.ctx = new AudioContext();
                }
                if (SoundFX.ctx && SoundFX.ctx.state === 'suspended') SoundFX.ctx.resume();
                return SoundFX.ctx;
            },
            play: (type) => {
                const ctx = SoundFX.init();
                if (!ctx) return;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                switch (type) {
                    case 'WORK': 
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5);
                        break;
                    case 'REST': 
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                        gain.gain.setValueAtTime(0.6, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                    case 'PIP': 
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(800, now);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                        osc.start(now); osc.stop(now + 0.05);
                        break;
                    case 'SERIES': 
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(660, now + 0.1);
                        osc.frequency.setValueAtTime(880, now + 0.2);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                        osc.start(now); osc.stop(now + 0.6);
                        break;
                }
            }
        };

        // 2. Verbal Speech Synthesis
        const SpeechEngine = {
            prime: () => {
                if ('speechSynthesis' in window) {
                    // Speak a silent utterance to unlock speech synthesis on user interaction
                    const u = new SpeechSynthesisUtterance('');
                    u.volume = 0;
                    window.speechSynthesis.speak(u);
                }
            },
            speak: (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Interrupt current speech
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 1.05; // Slightly faster for tactical feel
                    utterance.pitch = 0.9; // Slightly deeper
                    utterance.volume = 1;
                    window.speechSynthesis.speak(utterance);
                }
            }
        };

        // --- CUSTOM HOOKS ---
        const useWakeLock = () => {
            const [isLocked, setIsLocked] = useState(false);
            const wakeLockRef = useRef(null);

            const request = useCallback(async () => {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                        setIsLocked(true);
                        wakeLockRef.current.addEventListener('release', () => setIsLocked(false));
                    }
                } catch (err) {
                    console.error('Wake Lock error:', err);
                    setIsLocked(false);
                }
            }, []);

            const release = useCallback(async () => {
                if (wakeLockRef.current) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                    setIsLocked(false);
                }
            }, []);

            useEffect(() => {
                const handleVisibility = () => {
                    if (document.visibilityState === 'visible') request();
                };
                document.addEventListener('visibilitychange', handleVisibility);
                return () => {
                    release();
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [request, release]);

            return { isLocked, request, release };
        };

        const CUES = [
            "Shake the muscles. Fast and Loose.",
            "Do not sit down. Walk around.",
            "Nasal breathing only.",
            "Visualise the next set.",
            "Loose grip, explosive hips.",
            "Shake it out. Stay standing."
        ];

        // --- FOOTER COMPONENT ---
        const Footer = () => (
            <div className="w-full text-center pb-6 pt-4 mt-auto">
                <span className="text-[10px] font-mono tracking-[0.4em] text-gray-500 uppercase opacity-60">
                    Adapt // Recover // Master
                </span>
            </div>
        );

        // --- SYSTEM BADGE ---
        const SystemBadge = ({ text, active }) => (
            <div className="absolute top-6 right-6 flex items-center gap-2 z-50 glass-panel px-3 py-1.5 rounded-full border border-white/5 shadow-glass">
                <div className={`w-1.5 h-1.5 rounded-full ${active ? 'bg-brand-orange shadow-neon-orange animate-pulse' : 'bg-gray-600'}`}></div>
                <span className={`text-[10px] font-mono tracking-widest uppercase ${active ? 'text-white' : 'text-gray-500'}`}>{text}</span>
            </div>
        );

        // --- GATEWAY ---
        const Gateway = ({ onComplete }) => {
            const [soreness, setSoreness] = useState(null);
            const [tiredness, setTiredness] = useState(null);
            const [energy, setEnergy] = useState(null);

            const check = () => {
                let redFlags = 0;
                if (soreness === 3) redFlags++;
                if (tiredness === 3) redFlags++;
                if (energy === 1) redFlags++;
                onComplete(redFlags >= 2);
            };

            const getBtnColor = (isSelected, value, type) => {
                if (!isSelected) return 'btn-premium';
                
                const isBad = type === 'energy' ? value === 1 : value === 3;
                const isMed = value === 2;
                
                if (isBad) return 'bg-gradient-to-br from-orange-900 to-[#2a0e00] border-brand-orange text-brand-orange shadow-neon-orange font-semibold rounded-xl';
                if (isMed) return 'bg-gray-800 border-gray-500 text-gray-200 font-semibold rounded-xl';
                return 'bg-white border-white text-black shadow-neon-white font-semibold rounded-xl'; 
            };

            const Selector = ({ label, val, setVal, type }) => (
                <div className="mb-5">
                    <div className="flex justify-between items-center mb-2.5 px-1">
                        <span className="text-xs uppercase tracking-widest text-gray-400 font-medium">{label}</span>
                    </div>
                    <div className="flex gap-3 h-14">
                        {[1, 2, 3].map(v => (
                            <button 
                                key={v}
                                onClick={() => setVal(v)}
                                className={`flex-1 transition-all duration-300 font-mono text-sm tracking-wider ${getBtnColor(val === v, v, type)}`}
                            >
                                {type === 'energy' 
                                    ? (v === 1 ? 'LOW' : v === 2 ? 'MED' : 'HIGH')
                                    : (v === 1 ? 'LOW' : v === 2 ? 'MED' : 'HIGH')
                                }
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full animate-fade-in z-20 relative">
                    <div className="flex-1 flex flex-col justify-center">
                        <div className="mb-8 text-center">
                            <img src="nlcpWHITE.png" alt="NLC Performance" className="w-28 h-28 mx-auto rounded-full shadow-[0_0_30px_rgba(255,85,0,0.15)] mb-6 ring-1 ring-white/10 object-cover" />
                            <h1 className="text-4xl sm:text-5xl font-header font-bold tracking-tight leading-none text-white drop-shadow-lg mb-1">
                                Q&D <span className="text-brand-orange text-glow-orange">TIMER</span>
                            </h1>
                            <h2 className="text-[10px] font-mono tracking-[0.3em] text-gray-400 uppercase mt-2">NLC Performance</h2>
                        </div>
                        
                        <div className="glass-panel p-5 sm:p-6 mb-6">
                            <Selector label="Soreness" val={soreness} setVal={setSoreness} type="negative" />
                            <Selector label="Tiredness" val={tiredness} setVal={setTiredness} type="negative" />
                            <Selector label="Energy Levels" val={energy} setVal={setEnergy} type="energy" />
                        </div>
                    </div>
                    
                    <button 
                        disabled={!soreness || !tiredness || !energy}
                        onClick={check}
                        className="w-full py-5 bg-white text-black font-semibold text-sm uppercase tracking-widest rounded-2xl disabled:opacity-20 disabled:scale-100 hover:scale-[1.02] hover:bg-brand-orange hover:text-white hover:shadow-neon-orange transition-all duration-300 shadow-lg"
                    >
                        Initialize System
                    </button>
                    <Footer />
                </div>
            );
        };

        // --- SETUP ---
        const Setup = ({ forcedLow, onLaunch }) => {
            const [exercise, setExercise] = useState('A'); 
            const [protocol, setProtocol] = useState('5/4');
            const [badDay, setBadDay] = useState(false);
            const [rolled, setRolled] = useState(false);
            const [seriesCount, setSeriesCount] = useState(0);
            const [totalReps, setTotalReps] = useState(0);
            const [diceValue, setDiceValue] = useState(0);

            useEffect(() => {
                if (forcedLow) {
                    setSeriesCount(2);
                    setTotalReps(40);
                    setRolled(true);
                }
            }, [forcedLow]);

            const rollDie = () => {
                SoundFX.init(); 
                
                if (badDay) {
                    setSeriesCount(2);
                    setTotalReps(40);
                    setDiceValue(0);
                } else {
                    const roll = Math.floor(Math.random() * 6) + 1;
                    setDiceValue(roll);
                    
                    let s = 2;
                    if (roll === 1) s = 2;
                    else if (roll <= 3) s = 3;
                    else if (roll <= 5) s = 4;
                    else s = 5;
                    
                    setSeriesCount(s);
                    setTotalReps(s * 20); 
                }
                setRolled(true);
                SoundFX.play('SERIES');
            };

            const executeMission = () => {
                SpeechEngine.prime(); 
                onLaunch({ exercise, protocol, seriesCount, totalReps });
            };

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full justify-between animate-fade-in z-20 relative">
                    <div className="mt-4">
                        <div className="flex items-center gap-4 mb-8">
                            <img src="nlcpWHITE.png" alt="NLC Logo" className="w-12 h-12 rounded-full ring-1 ring-white/10" />
                            <div>
                                <h2 className="text-xl font-header font-bold text-white tracking-wide">MISSION CONFIG</h2>
                                <p className="text-[10px] font-mono text-brand-orange uppercase tracking-widest">Select Parameters</p>
                            </div>
                        </div>
                        
                        <div className="glass-panel p-5 sm:p-6 mb-6">
                            <div className="mb-8">
                                <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Movement Pattern</label>
                                <div className="flex gap-3">
                                    <button onClick={() => setExercise('A')} className={`btn-premium flex-1 py-4 text-sm ${exercise === 'A' ? 'selected' : ''}`}>Swings + Pushups</button>
                                    <button onClick={() => setExercise('B')} className={`btn-premium flex-1 py-4 text-sm ${exercise === 'B' ? 'selected' : ''}`}>Snatch (L/R)</button>
                                </div>
                            </div>
                            
                            <div className="mb-2">
                                <label className="text-xs font-semibold text-gray-400 uppercase mb-3 block tracking-wider">Protocol</label>
                                <div className="flex gap-3">
                                    <button onClick={() => setProtocol('5/4')} className={`btn-premium flex-1 py-4 ${protocol === '5/4' ? 'selected' : ''}`}>
                                        <span className="text-lg font-header">5/4</span><br/><span className={`text-[10px] uppercase font-mono tracking-widest opacity-70`}>Power</span>
                                    </button>
                                    <button onClick={() => setProtocol('10/2')} className={`btn-premium flex-1 py-4 ${protocol === '10/2' ? 'selected' : ''}`}>
                                        <span className="text-lg font-header">10/2</span><br/><span className={`text-[10px] uppercase font-mono tracking-widest opacity-70`}>Mass</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        {!forcedLow && !rolled && (
                            <div className="glass-panel p-4 flex items-center justify-between cursor-pointer hover:bg-white/5 transition-colors" onClick={() => setBadDay(!badDay)}>
                                <span className="text-xs font-semibold text-gray-300 uppercase tracking-widest">Manual Regression?</span>
                                <div className={`w-12 h-6 rounded-full relative transition-all duration-300 ${badDay ? 'bg-brand-orange shadow-neon-orange' : 'bg-gray-800'}`}>
                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all duration-300 ${badDay ? 'left-7' : 'left-1 shadow-sm'}`}></div>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    <div className="text-center mt-auto mb-2">
                        {!rolled ? (
                            <button onClick={rollDie} className="w-full py-5 bg-white text-black font-semibold text-sm uppercase tracking-widest rounded-2xl hover:scale-[1.02] hover:bg-brand-orange hover:text-white transition-all duration-300 shadow-lg hover:shadow-neon-orange">
                                Roll The Die
                            </button>
                        ) : (
                            <div className="animate-fade-in glass-panel p-8 shadow-2xl relative overflow-hidden border-t-2 border-t-brand-orange">
                                <div className="text-gray-400 text-[10px] font-mono uppercase tracking-widest mb-2">Target Acquired</div>
                                {diceValue > 0 && <div className="text-brand-orange text-xs font-mono font-bold mb-5 tracking-widest drop-shadow">DICE ROLLED: {diceValue}</div>}
                                
                                <div className="text-4xl md:text-5xl font-header font-bold text-white mb-6 leading-tight text-glow-white">
                                    {exercise === 'A' ? (
                                        <>
                                            {seriesCount * 20} <span className="text-xl text-gray-400 tracking-widest font-normal">SWINGS</span><br/>
                                            <span className="text-brand-orange text-2xl mx-2 opacity-50">/</span><br/>
                                            {seriesCount * 20} <span className="text-xl text-gray-400 tracking-widest font-normal">PUSHUPS</span>
                                        </>
                                    ) : (
                                        <>
                                            {seriesCount * 20} <span className="text-xl text-gray-400 tracking-widest font-normal">SNATCHES</span>
                                        </>
                                    )}
                                </div>

                                <div className="text-white text-xs font-medium uppercase tracking-widest mb-8 py-3 border-y border-white/10 bg-white/5 rounded-lg">{seriesCount} Series Total</div>
                                
                                {forcedLow && <div className="text-brand-orange text-[10px] font-mono border border-brand-orange/50 rounded-lg px-3 py-2 mb-6 bg-orange-900/20 shadow-neon-orange backdrop-blur-sm">⚠ READINESS COMPROMISED</div>}
                                
                                <button 
                                    onClick={executeMission}
                                    className="w-full py-5 bg-gradient-to-r from-brand-orange to-[#ff7700] text-white font-semibold text-sm uppercase tracking-widest rounded-xl hover:scale-[1.02] hover:shadow-neon-orange transition-all duration-300"
                                >
                                    Execute Order
                                </button>
                            </div>
                        )}
                    </div>
                    <Footer />
                </div>
            );
        };

        // --- ACTIVE SESSION ---
        const ActiveSession = ({ config, onFinish, onCancel }) => {
            const [time, setTime] = useState(0); 
            const [totalTime, setTotalTime] = useState(0); 
            const [currentSeries, setCurrentSeries] = useState(1);
            const [currentBlock, setCurrentBlock] = useState(config.exercise === 'A' ? 'SWINGS' : 'SNATCH');
            const [isActive, setIsActive] = useState(false);
            const [status, setStatus] = useState('GET READY'); 
            const [cue, setCue] = useState("");
            const [showAbortModal, setShowAbortModal] = useState(false);
            const [spokenState, setSpokenState] = useState(null);
            
            const intervalRef = useRef(null);
            const { isLocked, request: requestLock } = useWakeLock();

            const SERIES_DURATION = config.exercise === 'A' ? 180 : 240; 
            const workTriggers = config.protocol === '5/4' ? [0, 30, 60, 90] : [0, 60];
            const deepRestStart = config.protocol === '5/4' ? 120 : 90; 

            useEffect(() => { 
                setIsActive(true); 
                requestLock();
                SpeechEngine.speak("Standby. Mission begins.");
            }, [requestLock]);

            useEffect(() => {
                if (status === spokenState) return; 
                
                if (status === 'WORK') {
                    SpeechEngine.speak("Work!");
                } else if (status === 'RECOVER') {
                    SpeechEngine.speak("Recover.");
                } else if (status === 'DEEP REST') {
                    SpeechEngine.speak("Deep rest.");
                    if (cue) {
                        setTimeout(() => {
                            if(isActive) SpeechEngine.speak(cue);
                        }, 2500);
                    }
                }
                setSpokenState(status);
            }, [status, cue, spokenState, isActive]);

            useEffect(() => {
                if (isActive && !showAbortModal) {
                    intervalRef.current = setInterval(() => {
                        setTime(t => t + 1);
                        setTotalTime(tt => tt + 1);
                    }, 1000);
                } else {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [isActive, showAbortModal]);

            useEffect(() => {
                if (showAbortModal) return;

                if (time >= SERIES_DURATION) {
                    if (config.exercise === 'A') {
                        if (currentBlock === 'SWINGS') {
                            setCurrentBlock('PUSHUPS');
                            setTime(0);
                            setStatus('GET READY');
                            SoundFX.play('SERIES');
                        } else {
                            if (currentSeries < config.seriesCount) {
                                setCurrentSeries(c => c + 1);
                                setCurrentBlock('SWINGS');
                                setTime(0);
                                setStatus('GET READY');
                                SoundFX.play('SERIES');
                            } else {
                                setIsActive(false);
                                SpeechEngine.speak("Mission Complete. Well done.");
                                onFinish(totalTime);
                            }
                        }
                    } else {
                        if (currentSeries < config.seriesCount) {
                            setCurrentSeries(c => c + 1);
                            setTime(0);
                            setStatus('GET READY');
                            SoundFX.play('SERIES');
                        } else {
                            setIsActive(false);
                            SpeechEngine.speak("Mission Complete. Well done.");
                            onFinish(totalTime);
                        }
                    }
                    return;
                }

                if (workTriggers.includes(time)) {
                    setStatus('WORK');
                    SoundFX.play('WORK'); 
                    setCue("");
                } else if (time >= deepRestStart) {
                    if (status !== 'DEEP REST') {
                        setStatus('DEEP REST');
                        setCue(CUES[Math.floor(Math.random() * CUES.length)]);
                    }
                } else {
                    const timeSinceTrigger = Math.min(...workTriggers.map(t => time - t).filter(d => d >= 0));
                    if (timeSinceTrigger === 20 && status === 'WORK') {
                        setStatus('RECOVER');
                        SoundFX.play('REST'); 
                    }
                }

                const nextTrigger = workTriggers.find(t => t > time) || SERIES_DURATION;
                if (nextTrigger - time <= 3 && nextTrigger - time > 0) {
                    SoundFX.play('PIP'); 
                }

            }, [time, config, currentSeries, currentBlock, showAbortModal]);

            const getInstruction = () => {
                if (status === 'WORK') return config.protocol === '5/4' ? `EXPLODE: 5` : `POWER: 10`;
                if (status === 'RECOVER') return "SHAKE IT OUT";
                if (status === 'DEEP REST') return "DEEP RECOVERY";
                return "GET READY";
            }

            const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
            
            let statusColor = "text-gray-500";
            if (status === 'WORK') statusColor = "text-white text-glow-white";
            if (status === 'RECOVER') statusColor = "text-gray-400";
            if (status === 'DEEP REST') statusColor = "text-brand-orange text-glow-orange";

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto relative w-full z-20">
                    <SystemBadge text="Screen Lock Active" active={isLocked} />
                    
                    {/* Header */}
                    <div className="flex justify-between items-end pb-4 mb-8 mt-4">
                        <div className="glass-panel px-4 py-2 flex gap-4 items-center border-none bg-white/5">
                            <div>
                                <div className="text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1">Series</div>
                                <div className="text-2xl font-header font-bold text-white drop-shadow">{currentSeries} <span className="text-gray-500 text-lg font-normal">/ {config.seriesCount}</span></div>
                            </div>
                            <div className="w-px h-8 bg-white/10"></div>
                            <div>
                                <div className="text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1">Total</div>
                                <div className="text-xl font-mono text-gray-200">{formatTime(totalTime)}</div>
                            </div>
                        </div>
                    </div>

                    {/* HUD */}
                    <div className="flex-1 flex flex-col items-center justify-center relative">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-brand-orange/10 rounded-full blur-3xl -z-10 animate-pulse-orange pointer-events-none"></div>

                        <div className="glass-panel px-6 py-1.5 mb-6 rounded-full border-brand-orange/30 bg-orange-900/10">
                            <span className="text-xs font-semibold text-brand-orange uppercase tracking-[0.2em] shadow-sm">
                                {currentBlock}
                            </span>
                        </div>
                        
                        <div className={`text-4xl sm:text-5xl md:text-6xl font-header font-bold italic uppercase text-center leading-none mb-8 ${statusColor} transition-all duration-500`}>
                            {getInstruction()}
                        </div>
                        
                        <div className="w-full bg-black/50 border border-white/10 h-2 sm:h-3 mb-10 relative overflow-hidden rounded-full backdrop-blur-sm">
                            <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-white/50 to-white transition-all duration-1000 linear shadow-neon-white rounded-full" style={{width: `${(time / SERIES_DURATION) * 100}%`}}></div>
                        </div>
                        
                        <div className="text-8xl sm:text-9xl font-mono font-bold text-white tracking-tighter drop-shadow-xl" style={{ fontVariantNumeric: 'tabular-nums' }}>
                            {formatTime(SERIES_DURATION - time)}
                        </div>
                        
                        <div className="h-24 mt-10 w-full max-w-sm">
                            {status === 'DEEP REST' && (
                                <div className="p-5 glass-panel border-l-4 border-l-brand-orange rounded-xl animate-fade-in shadow-lg bg-black/40">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="w-2 h-2 rounded-full bg-brand-orange animate-pulse"></div>
                                        <div className="text-[10px] font-mono text-brand-orange uppercase font-bold tracking-widest">Audio Coach</div>
                                    </div>
                                    <div className="text-lg font-medium italic text-gray-200 leading-snug">"{cue}"</div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* ABORT BUTTON */}
                    <div className="mt-auto pt-4 flex flex-col items-center">
                        <button onClick={() => setShowAbortModal(true)} className="text-[10px] font-semibold text-gray-500 uppercase tracking-widest hover:text-brand-orange px-6 py-3 transition-colors rounded-full hover:bg-white/5 mb-2">
                            Abort Mission
                        </button>
                        <Footer />
                    </div>

                    {/* ABORT MODAL */}
                    {showAbortModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6 backdrop-blur-xl">
                            <div className="w-full max-w-sm glass-panel p-8 text-center animate-fade-in border-2 border-brand-orange/50 shadow-2xl">
                                <div className="w-16 h-16 rounded-full bg-brand-orange/20 flex items-center justify-center mx-auto mb-4">
                                    <span className="text-3xl">⚠</span>
                                </div>
                                <h2 className="text-2xl font-header font-bold text-white uppercase mb-2">Abort Mission?</h2>
                                <p className="text-gray-400 mb-8 text-sm leading-relaxed">All active session data will be permanently lost.</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowAbortModal(false)} className="flex-1 py-4 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition-colors">Resume</button>
                                    <button onClick={() => { SpeechEngine.speak("Mission Aborted."); onCancel(); }} className="flex-1 py-4 bg-brand-orange hover:bg-[#ff7700] text-white font-bold rounded-xl shadow-neon-orange transition-colors">ABORT</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- SUMMARY ---
        const Summary = ({ totalTime, config, onReset }) => {
            const [feedback, setFeedback] = useState(null);
            const formatTime = (s) => `${Math.floor(s / 60)}m ${s % 60}s`;

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full justify-center text-center animate-fade-in z-20 relative">
                    
                    <img src="nlcpWHITE.png" alt="NLC Logo" className="w-20 h-20 mx-auto rounded-full ring-1 ring-white/10 mb-6 opacity-80" />
                    <h1 className="text-4xl md:text-5xl font-header font-bold text-white mb-4 drop-shadow-lg text-glow-white">MISSION COMPLETE</h1>
                    <div className="w-12 h-1 bg-brand-orange mx-auto mb-10 shadow-neon-orange rounded-full"></div>
                    
                    <div className="grid grid-cols-2 gap-4 mb-10">
                        <div className="glass-panel p-6 flex flex-col justify-center shadow-lg">
                            <div className="text-[10px] font-semibold text-brand-orange uppercase tracking-widest mb-2">Duration</div>
                            <div className="text-3xl font-mono text-white">{formatTime(totalTime)}</div>
                        </div>
                        <div className="glass-panel p-6 flex flex-col justify-center shadow-lg">
                            <div className="text-[10px] font-semibold text-brand-orange uppercase tracking-widest mb-2">Total Volume</div>
                            <div className="text-xl font-mono text-white leading-snug">
                                {config.exercise === 'A' ? (
                                    <>
                                        {config.seriesCount * 20} Swings<br/>
                                        <span className="text-white/20 text-sm">/</span><br/>
                                        {config.seriesCount * 20} Pushups
                                    </>
                                ) : (
                                    <>{config.seriesCount * 20} Snatches</>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    <div className="mb-12 relative z-10 glass-panel p-6">
                        <div className="text-xs font-semibold text-gray-300 uppercase tracking-widest mb-5">Post-Action Report</div>
                        <div className="flex gap-3">
                            {['EASY', 'STRONG', 'SMOKED'].map((rating) => (
                                <button 
                                    key={rating} 
                                    onClick={() => setFeedback(rating)} 
                                    className={`flex-1 py-4 font-semibold text-xs tracking-wider transition-all duration-300 rounded-xl border ${
                                        feedback === rating 
                                            ? (rating === 'SMOKED' ? 'bg-orange-900/80 border-brand-orange text-brand-orange shadow-neon-orange scale-[1.02]' : 'bg-white text-black border-white shadow-neon-white scale-[1.02]') 
                                            : 'bg-black/40 border-white/10 text-gray-400 hover:bg-white/5'
                                    }`}
                                >
                                    {rating}
                                </button>
                            ))}
                        </div>
                        {feedback === 'SMOKED' && (
                            <div className="mt-5 text-brand-orange text-[10px] font-mono border border-brand-orange/50 rounded-lg p-3 bg-orange-900/20 shadow-neon-orange animate-fade-in">
                                ⚠ INTENSITY THRESHOLD EXCEEDED.<br/>REDUCE LOAD NEXT SESSION.
                            </div>
                        )}
                    </div>
                    
                    <div className="mt-auto flex flex-col items-center relative z-10">
                        <button onClick={onReset} className="text-gray-400 border border-white/10 px-8 py-4 text-xs font-semibold uppercase tracking-widest rounded-2xl hover:text-white hover:bg-white/5 transition-all mb-4 glass-panel">
                            Restart System
                        </button>
                        <Footer />
                    </div>
                </div>
            );
        };

        // --- APP ROOT ---
        const App = () => {
            const [view, setView] = useState('GATEWAY'); 
            const [forcedLow, setForcedLow] = useState(false);
            const [config, setConfig] = useState({});
            const [sessionData, setSessionData] = useState({});

            const handleGatewayComplete = (isLow) => {
                setForcedLow(isLow);
                setView('SETUP');
            };

            const handleLaunch = (launchConfig) => {
                setConfig(launchConfig);
                setView('WORKOUT');
            };

            const handleFinish = (finalTime) => {
                setSessionData({ time: finalTime, config: config });
                setView('SUMMARY');
            };

            const handleCancel = () => {
                setForcedLow(false);
                setConfig({});
                setView('GATEWAY');
            };

            return (
                <div className="w-full h-full">
                    {view === 'GATEWAY' && <Gateway onComplete={handleGatewayComplete} />}
                    {view === 'SETUP' && <Setup forcedLow={forcedLow} onLaunch={handleLaunch} />}
                    {view === 'WORKOUT' && <ActiveSession config={config} onFinish={handleFinish} onCancel={handleCancel} />}
                    {view === 'SUMMARY' && <Summary totalTime={sessionData.time} config={sessionData.config} onReset={handleCancel} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
